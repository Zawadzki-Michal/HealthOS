name: Deploy health-mcp Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/health-mcp/**"
      - ".github/workflows/deploy-health-mcp.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: workers/health-mcp
      - run: npx tsc --noEmit
        working-directory: workers/health-mcp
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/health-mcp
          command: deploy
